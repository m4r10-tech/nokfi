<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1456A2" />
  <meta name="description" content="Nokfi — Diagnóstico financiero y análisis de datos con IA para autónomos y pymes." />
  <link rel="canonical" href="https://nokfi.app/home" />

  <!-- Open Graph / Twitter — presentación al compartir nokfi.app en redes.
       og-image.png (1200x630) se genera del logo real (public/favicon.svg)
       sobre fondo oscuro; vive en public/ y la CSP no le aplica (la piden
       los crawlers, no la página). -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Nokfi" />
  <meta property="og:title" content="Nokfi — Tu negocio, bajo control" />
  <meta property="og:description" content="Diagnóstico financiero y análisis de datos con IA para autónomos y pymes." />
  <meta property="og:url" content="https://nokfi.app/home" />
  <meta property="og:image" content="https://nokfi.app/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Nokfi — Tu negocio, bajo control" />
  <meta name="twitter:description" content="Diagnóstico financiero y análisis de datos con IA para autónomos y pymes." />
  <meta name="twitter:image" content="https://nokfi.app/og-image.png" />

  <!--
    CSP (sesión 4, §2.4): se define SOLO como cabecera HTTP en Nginx
    (deploy/nginx-nokfi.conf), que además admite frame-ancestors 'none'.
    La antigua <meta> se retiró para no mantener dos fuentes de verdad.
    DOMPurify (middleware/sanitize.js) sigue siendo la defensa real contra XSS.
  -->

  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <title>Nokfi — Tu negocio, bajo control</title>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
