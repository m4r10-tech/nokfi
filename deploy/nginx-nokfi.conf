# ==========================================================================
# Nokfi — Nginx producción (dominio único https://nokfi.app)
# --------------------------------------------------------------------------
# Sirve el frontend (SPA construida con VITE_API_URL=/api) y hace proxy de
# /api/ → backend PM2 nokfi-backend (127.0.0.1:3001). Single-origin: el
# frontend llama a /api/... en su propio origen → no hay CORS, no hay IP
# hardcodeada en el bundle, y connect-src 'self' basta.
#
# Este archivo es COPIA EXACTA de /etc/nginx/sites-available/nokfi en el VPS
# (incluidas las líneas «managed by Certbot»). Si se cambia uno, cambiar el otro.
#
# Instalación (pasos del usuario, con sudo):
#   sudo apt install -y nginx certbot python3-certbot-nginx
#   sudo cp deploy/nginx-nokfi.conf /etc/nginx/sites-available/nokfi
#   sudo ln -s /etc/nginx/sites-available/nokfi /etc/nginx/sites-enabled/nokfi
#   sudo rm /etc/nginx/sites-enabled/default      # quitar el site por defecto
#   # Permisos para que www-data pueda leer el dist (una sola vez):
#   sudo chmod o+x /home/deploy /home/deploy/nokfi \
#                   /home/deploy/nokfi/frontend
#   sudo nginx -t && sudo systemctl reload nginx
#   # Cortafuegos: 80/443 SOLO desde las IP de Cloudflare (ver docs/deploy.md §6).
#   sudo certbot --nginx -d nokfi.app -d www.nokfi.app --redirect   # cert único (SAN) para ambos + 80→443
#
# Redeploy del frontend: build en local con VITE_API_URL=/api y rsync del dist
# (Nginx sirve directamente ~/nokfi/frontend/dist — sin copiar a /var/www).
#
# Notas:
#  - certbot --nginx reescribe este server block (añade listen 443 ssl + los
#    certificados y un redirect 80→443). No hace falta tocarlo a mano.
#  - Las cabeceras de seguridad (hallazgo #14) se definen UNA vez a nivel de
#    server y heredan a todas las location, salvo /api/, que declara las suyas
#    (sin la CSP de la web) y oculta las mismas de Express para no duplicarlas.
#    expires no rompe la herencia de add_header.
#  - frame-ancestors 'none' + X-Frame-Options DENY SÍ aplican aquí (en la
#    <meta> de index.html no soportan frame-ancestors → defensa real = esta).
#  - TLS 1.2+ y server_tokens off también a nivel http en /etc/nginx/nginx.conf.
# ==========================================================================

# S15b: log sin los tokens de los enlaces de gestoría (/compartido/<token> y
# /api/shared/<token>), ni en la petición ni en el Referer → «***».
map $request $nokfi_safe_request {
    "~^(?<nk_rq1>[^ ]+ [^ ]*?/(?:api/shared|compartido)/)[^/?# ]+(?<nk_rq2>.*)$"  "${nk_rq1}***${nk_rq2}";
    default $request;
}
map $http_referer $nokfi_safe_referer {
    "~^(?<nk_rf1>.*?/(?:api/shared|compartido)/)[^/?# ]+(?<nk_rf2>.*)$"  "${nk_rf1}***${nk_rf2}";
    ""      "-";
    default $http_referer;
}
log_format nokfi_safe '$remote_addr - $remote_user [$time_local] "$nokfi_safe_request" '
                      '$status $body_bytes_sent "$nokfi_safe_referer" "$http_user_agent"';

# S15b (B2): Host desconocido o sin SNI → se cierra la conexión (444 / handshake rechazado).
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    ssl_reject_handshake on;
    server_tokens off;
    access_log /var/log/nginx/access.log nokfi_safe;
    return 444;
}

server {
    server_name nokfi.app www.nokfi.app;
    # www → nokfi.app (canónico, SEO). Restaurado 2026-10-24 en el VPS nuevo.
    if ($host = www.nokfi.app) { return 301 https://nokfi.app$request_uri; }

    access_log /var/log/nginx/access.log nokfi_safe;

    # --- Cabeceras de seguridad (#14) — heredan a todas las location (menos /api/) ---
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # Sesión 4 (§2.4): ÚNICA fuente de la CSP (se retiró la <meta> de index.html
    # para no tener dos fuentes de verdad). worker-src: worker de pdf.js.
    # Sesión 12: Cloudflare Web Analytics (sin cookies; Cloudflare inyecta su
    # script en el HTML) → static.cloudflareinsights.com en script-src y
    # cloudflareinsights.com en connect-src.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://cloudflareinsights.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';" always;

    # Ocultar versión de nginx; subir límite para subidas de Excel al /api.
    server_tokens off;
    client_max_body_size 10m;

    root /home/deploy/nokfi/frontend/dist;
    index index.html;

    # --- API → backend PM2 (sin trailing slash: pasa /api/... literal) ---
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        # El webhook de Stripe (/api/webhooks/stripe) llega aquí también; Express
        # lo lee con express.raw → la signatura se verifica igual (nginx no toca el body).
        # S15b (S7): una sola cabecera por directiva. Se ocultan las de helmet y
        # se ponen aquí (también en los 502/504 de Nginx). Sin la CSP de la web.
        # Las Access-Control-* de Express (CORS abierto de /api/v1/openapi.json y
        # /api/mcp) NO se tocan. Sin proxy_ignore_client_abort (la cancelación de
        # la IA necesita que el corte del navegador llegue al backend).
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    }

    # --- Assets del build (nombres con hash → cache inmutable 1 año) ---
    location ~* ^/assets/ {
        expires 1y;
        access_log off;
    }
    # S15b (A6): capturas de la landing y fuente → 30 días (sin hash en el nombre, cambian poco).
    location ~* ^/(screens|fonts)/ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }
    # SW + manifest → sin caché para que las actualizaciones PWA propaguen.
    location = /sw.js               { expires -1; }
    location = /registerSW.js       { expires -1; }
    location = /manifest.webmanifest{ expires -1; }

    # --- SPA fallback (React Router) ---
    # Sesión 12: las páginas públicas están prerenderizadas en dist/<ruta>/index.html.
    # $uri/index.html las sirve tal cual (con solo $uri/ Nginx redirigía con 301 a
    # /<ruta>/, y la canonical no lleva barra final); el resto cae en la SPA.
    location / {
        try_files $uri $uri/index.html $uri/ /index.html;
    }

    # Nunca servir ocultos / backups (.env incluido).
    location ~ /\.(?!well-known) { deny all; }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/nokfi.app/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/nokfi.app/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}

# ==========================================================================
# Nota sobre www (canonicalización)
# --------------------------------------------------------------------------
# El dominio canónico es nokfi.app. El certificado LE es uno solo (SAN nokfi.app
# + www.nokfi.app). www → https://nokfi.app con 301 YA está hecho en dos sitios:
# la Redirect Rule de Cloudflare (excluye /.well-known/acme-challenge/ para que
# renueve el SAN www) y el `if ($host = www.nokfi.app)` del server de arriba.
# ==========================================================================


server {
    if ($host = www.nokfi.app) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = nokfi.app) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name nokfi.app www.nokfi.app;
    access_log /var/log/nginx/access.log nokfi_safe;
    return 404; # managed by Certbot




}
