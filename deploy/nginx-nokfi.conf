# ==========================================================================
# Nokfi — Nginx producción (dominio único https://nokfi.app)
# --------------------------------------------------------------------------
# Sirve el frontend (SPA construida con VITE_API_URL=/api) y hace proxy de
# /api/ → backend PM2 nokfi-backend (127.0.0.1:3001). Single-origin: el
# frontend llama a /api/... en su propio origen → no hay CORS, no hay IP
# hardcodeada en el bundle, y connect-src 'self' basta.
#
# Instalación (pasos del usuario, con sudo):
#   sudo apt install -y nginx certbot python3-certbot-nginx
#   sudo cp deploy/nginx-nokfi.conf /etc/nginx/sites-available/nokfi
#   sudo ln -s /etc/nginx/sites-available/nokfi /etc/nginx/sites-enabled/nokfi
#   sudo rm /etc/nginx/sites-enabled/default      # quitar el site por defecto
#   # Permisos para que www-data pueda leer el dist (una sola vez):
#   sudo chmod o+x /home/deploy /home/deploy/nokfi-fase3 \
#                   /home/deploy/nokfi-fase3/frontend
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo ufw allow 'Nginx Full'                   # 80+443
#   sudo certbot --nginx -d nokfi.app -d www.nokfi.app --redirect   # cert único (SAN) para ambos + 80→443
#
# Redeploy del frontend (sin sudo): en el VPS
#   cd ~/nokfi-fase3 && git pull --ff-only && cd frontend && VITE_API_URL=/api npm run build
# (Nginx sirve directamente ~/nokfi-fase3/frontend/dist — sin copiar a /var/www.)
#
# Notas:
#  - certbot --nginx reescribe este server block (añade listen 443 ssl + los
#    certificados y un redirect 80→443). No hace falta tocarlo a mano.
#  - Las cabeceras de seguridad (hallazgo #14) se definen UNA vez a nivel de
#    server y heredan a todas las location (ningún location añade add_header
#    propio, salvo expires — que no rompe la herencia de add_header).
#  - frame-ancestors 'none' + X-Frame-Options DENY SÍ aplican aquí (en la
#    <meta> de index.html no soportan frame-ancestors → defensa real = esta).
# ==========================================================================

server {
    listen 80;
    listen [::]:80;
    server_name nokfi.app www.nokfi.app;

    # --- Cabeceras de seguridad (#14) — heredan a todas las location ---
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # CSP igual a la <meta> de index.html + frame-ancestors 'none' (solo posible aquí).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';" always;

    # Ocultar versión de nginx; subir límite para subidas de Excel al /api.
    server_tokens off;
    client_max_body_size 10m;

    root /home/deploy/nokfi-fase3/frontend/dist;
    index index.html;

    # --- API → backend PM2 (sin trailing slash: pasa /api/... literal) ---
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        # El webhook de Stripe (/api/webhooks/stripe) llega aquí también; Express
        # lo lee con express.raw → la signatura se verifica igual (nginx no toca el body).
    }

    # --- Assets del build (nombres con hash → cache inmutable 1 año) ---
    location ~* ^/assets/ {
        expires 1y;
        access_log off;
    }
    # SW + manifest → sin caché para que las actualizaciones PWA propaguen.
    location = /sw.js               { expires -1; }
    location = /registerSW.js       { expires -1; }
    location = /manifest.webmanifest{ expires -1; }

    # --- SPA fallback (React Router) ---
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Nunca servir ocultos / backups (.env incluido).
    location ~ /\.(?!well-known) { deny all; }
}

# ==========================================================================
# Nota sobre www (canonicalización — polish post-certbot)
# --------------------------------------------------------------------------
# El dominio canónico es nokfi.app. El usuario apuntó también www.nokfi.app al
# VPS para que "no dé página rara". Para que el primer cert no corra riesgos
# con certbot, este server block atiende AMBOS nombres (server_name de arriba);
# certbot emite un único cert SAN válido para nokfi.app Y www.nokfi.app, así
# ambos sirven HTTPS sin aviso de cert. Esto significa que https://www.nokfi.app
# sirve el MISMO contenido que https://nokfi.app temporalmente (contenido
# duplicado, sin 301 aún) — aceptable para el lanzamiento (0 usuarios, 0 SEO).
#
# TRAS confirmar el SSL verde, se añade como polish un block redirect 301
# en el puerto 443 para www → nokfi.app (canonización SEO + URL limpia):
#   server { listen 443 ssl; server_name www.nokfi.app; return 301 https://nokfi.app$request_uri; }
# (y se quita www del server_name del block principal, para que el de arriba
# deje de servir www). Ese paso no toca el cert ni puede romper nada.
# ==========================================================================
