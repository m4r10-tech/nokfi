# ==========================================================================
# Nokfi — Nginx real-IP desde Cloudflare (anti-spoof)
# --------------------------------------------------------------------------
# Cloudflare se interpone entre el cliente y el VPS. Para que Express vea en
# req.ip la IP REAL del visitante (no la del edge de CF), Nginx reescribe
# $remote_addr usando la cabecera CF-Connecting-IP — pero SOLO cuando la
# conexión entrante proviene de un rango IP de Cloudflare.
#
# Anti-spoof: un atacante que conecte DIRECTO al VPS (a la IP 191.44.112.86,
# sin pasar por CF) y falsifique la cabecera CF-Connecting-IP NO proviene de un
# rango de CF → set_real_ip_from no aplica → Nginx deja $remote_addr como la IP
# verdadera del atacante (no la falsa). Express (trust proxy:1, server.js:39)
# sigue recibiendo req.ip correcto vía X-Real-IP/X-Forwarded-For en
# nginx-nokfi.conf. Los 5 rate-limiters del backend (general/auth/ai/webhook/
# admin en server.js) siguen keyeando por visitante real — sin esto banearían a
# todo el sitio (todas las peticiones llegarían con la misma IP del edge CF).
#
# Es directiva de nivel http{} (no server{}), así que va en un fichero aparte
# que el nginx.conf raíz incluye con `include /etc/nginx/conf.d/*.conf;`. No
# toca nginx-nokfi.conf.
#
# Instalación (paso sudo del usuario):
#   sudo cp deploy/nginx-cloudflare-realip.conf /etc/nginx/conf.d/cloudflare.conf
#   sudo nginx -t && sudo systemctl reload nginx
# No requiere pm2 restart (Nginx only; Express sin cambios).
#
# RANGOS: lista oficial de Cloudflare en https://www.cloudflare.com/ips/
# CF añade rangos nuevos ocasionalmente → revisar esa página cada cierto tiempo
# (p.ej. trimestral) y actualizar este fichero. Si un rango nuevo no se añade,
# las peticiones de ese edge CF llegarían a Express con req.ip = IP del edge
# (no del visitante) → rate-limit/audit degradados solo para ese rango. El
# módulo http_realip_module viene compilado en el paquete nginx de Debian/Ubuntu
# (verificar con `nginx -V 2>&1 | grep http_realip_module` — ya viene por defecto).
# ==========================================================================

# --- IPv4 de Cloudflare ---
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;

# --- IPv6 de Cloudflare ---
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/29;

# Cabecera de CF con la IP real del cliente, y procesar X-Forwarded-For
# recursivamente (por si CF añade saltos) → el último IP no-CF es el real.
real_ip_header CF-Connecting-IP;
real_ip_recursive on;
